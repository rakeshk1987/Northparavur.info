<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description"
		content="Welcome to NorthParavur.in — the official digital guide to North Paravur (Ancient Muziris), Kerala. Search tourist attractions, Cherai Beach resorts, Chendamangalam heritage, hospitals, schools, temples, churches, mosques, and local businesses.">
	<meta name="keywords" content="North Paravur, northparavur.in, Muziris Heritage, Cherai Beach, Chendamangalam, Kadamakudy, Hospitals in North Paravur, Schools in North Paravur, Paravur Taluk">
	<link rel="canonical" href="https://northparavur.in/">

	<!-- OpenGraph / WhatsApp Preview Meta Tags -->
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://northparavur.in/">
	<meta property="og:title" content="NorthParavur.in | Gateway to Ancient Muziris & Local Business Guide">
	<meta property="og:description" content="Explore 2,000+ years of Muziris history, plan your Cherai & Kadamakudy day trip, or search North Paravur's local business & civic directory.">
	<meta property="og:image" content="https://northparavur.in/img/home.JPG">

	<title>NorthParavur.in | Gateway to Ancient Muziris & Local Directory</title>

	<link rel="icon" href="./img/favicon.ico" />
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css"
		integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
	<link rel="stylesheet" href="./css/mockup.css?v=2">

	<!-- JSON-LD Structured Data for Google Local & Tourism SEO -->
	<script type="application/ld+json">
	{
		"@context": "https://schema.org",
		"@type": "WebSite",
		"name": "NorthParavur.in",
		"alternateName": "North Paravur — Gateway to Ancient Muziris & Local Directory",
		"url": "https://northparavur.in/",
		"description": "Comprehensive heritage tourism guide and local business directory for North Paravur Taluk, Ernakulam, Kerala."
	}
	</script>
</head>

<body>
	<header>
		<div class="topBar">
			<!-- Live Temperature + 7-Day Forecast on Left of Header -->
			<div class="weatherWrap" id="weatherWrap">
				<button class="weatherPill" type="button" onclick="document.getElementById('weatherWrap').classList.toggle('open')" title="Click or hover for 7-Day Forecast">
					<i class="fas fa-sun"></i>
					<span id="headerTempText">Loading °C...</span>
					<i class="fas fa-chevron-down" style="font-size:10px; opacity:0.7;"></i>
				</button>
				<div class="weatherPopover" id="weatherPopover">
					<div style="font-weight:800; font-size:12.5px; color:var(--brand-primary); margin-bottom:8px; text-transform:uppercase; letter-spacing:0.6px;">
						<i class="fas fa-cloud-sun"></i> 7-Day Forecast — North Paravur
					</div>
					<div id="forecastList">Loading 7-day forecast...</div>
				</div>
			</div>

			<!-- Brand Center -->
			<a class="brandWrap" href="#home" onclick="switchView('home')">
				<div class="brandLogo">NorthParavur.in</div>
				<div class="brandTag">Gateway to Ancient Muziris &bull; Local Guide</div>
			</a>

			<!-- Theme & Language Controls on Right -->
			<div class="topControls">
				<button id="mockThemeBtn" class="pillBtn" onclick="toggleMockTheme()" type="button">
					<i class="fas fa-moon"></i> Dark
				</button>
				<button id="mockLangBtn" class="pillBtn" onclick="toggleMockLang()" type="button">
					<i class="fas fa-language"></i> മലയാളം
				</button>
			</div>
		</div>

		<nav class="navStrip" aria-label="Primary Navigation">
			<div class="navInner">
				<button class="navTab activeNav" data-view="home" onclick="switchView('home')"><i class="fas fa-home"></i> Home</button>
				<button class="navTab" data-view="news" onclick="switchView('news')"><i class="fas fa-newspaper"></i> News</button>
				<button class="navTab" data-view="events" onclick="switchView('events')"><i class="fas fa-calendar-alt"></i> Events</button>
				<button class="navTab" data-view="history" onclick="switchView('history')"><i class="fas fa-history"></i> History</button>
				<button class="navTab" data-view="tourism" onclick="switchView('tourism')"><i class="fas fa-umbrella-beach"></i> Tourism</button>
				<button class="navTab" data-view="personalities" onclick="switchView('personalities')"><i class="fas fa-user-tie"></i> Personalities</button>
				<button class="navTab" data-view="taluk" onclick="switchView('taluk')"><i class="fas fa-map-marked-alt"></i> Taluk</button>
				<button class="navTab" data-view="gallery" onclick="switchView('gallery')"><i class="far fa-images"></i> Gallery</button>
				<button class="navTab" data-view="worship" onclick="switchView('worship')"><i class="fas fa-place-of-worship"></i> Temples &amp; Churches</button>
				<button class="navTab" data-view="directory" onclick="switchView('directory')"><i class="fas fa-address-book"></i> Directory</button>
			</div>
		</nav>
	</header>

	<main class="pageShell">
		<div id="mockStage"></div>
	</main>

	<!-- Global Popup Modal for Tourism, Personalities, Gallery & Worship Tiles -->
	<div id="mockModal" class="modalBackdrop" onclick="if(event.target===this) closeMockModal()">
		<div id="mockModalInner" class="modalDialog"></div>
	</div>

	<footer class="mockFooter">
		<div><b>NorthParavur.in</b> &bull; Muziris Royal Heritage &amp; Local Business Directory &bull; Ernakulam, Kerala</div>
		<div style="margin-top:6px; font-size:12px;">
			<a href="#directory" onclick="switchView('directory')" style="color:var(--brand-primary); text-decoration:none; margin:0 8px;">Business Directory</a> &bull;
			<a href="#news" onclick="switchView('news')" style="color:var(--brand-primary); text-decoration:none; margin:0 8px;">Local News</a> &bull;
			<a href="#events" onclick="switchView('events')" style="color:var(--brand-primary); text-decoration:none; margin:0 8px;">Festivals &amp; Events</a> &bull;
			<a href="#tourism" onclick="switchView('tourism')" style="color:var(--brand-primary); text-decoration:none; margin:0 8px;">Tourism &amp; Boat Cruise</a>
		</div>
	</footer>

	<script src="./data/masterData.js"></script>
	<script src="./scripts/mockup.js?v=2"></script>
</body>

</html>
